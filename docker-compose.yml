services:
  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      HEADLESS_SCRAPE: "true"
    volumes:
      - ./backend/db.json:/app/db.json

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: http://backend:5000
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    ports:
      - "3000:3000"